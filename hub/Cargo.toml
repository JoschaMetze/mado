[package]
name = "mado-hub"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/abradburne/mado"
description = "Hub for Mado frames: relays alerts, scenes and screenshots between senders (HTTP, MCP) and the frame."

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
ureq = { version = "2", features = ["json"] }

# Artwork resizing is painfully slow in an unoptimised `image`.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
