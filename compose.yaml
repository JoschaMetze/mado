# docker compose up -d
# The frame and your other devices reach the hub on port 7878 of this machine.
services:
  hub:
    build: ./hub
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - mado-data:/data
    # For frames to find the hub by themselves (Linux only): remove `ports` above and use
    # the host's network, so the hub's mDNS announcement reaches the LAN.
    # network_mode: host
    # environment:
    #   MADO_ADVERTISE: "on"

volumes:
  mado-data:
