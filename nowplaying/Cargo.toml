[package]
name = "mado-nowplaying"
version = "0.1.0"
edition = "2021"
description = "macOS helper that tells a Mado hub what Apple Music is playing, and carries play/pause taps back."

[dependencies]
base64 = "0.22"
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
